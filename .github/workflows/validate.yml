name: Validate MyLife frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/multi-user-20]

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check firebase-config.js
      - name: Check multi-user pilot safeguards
        run: node scripts/validate-pilot.js
